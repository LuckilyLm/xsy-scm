<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSY-SCM 业务流程图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;
      --color-paper2:  #ececec;
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">业务流程 · XSY-SCM</p>
    <h1>生鲜供应链端到端业务流程</h1>

    <svg viewBox="0 0 1176 516" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="xsy-flow-title xsy-flow-desc">
      <title id="xsy-flow-title">XSY-SCM 端到端业务流程泳道图</title>
      <desc id="xsy-flow-desc">泳道图展示供应商、采购、库存、销售、客户五大角色，在采购入库、销售出库、库存调整三条主线中的协作与库存数据流转。</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <!-- Paper background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Alternating lane tints (odd lanes 0,2,4) -->
      <rect x="140" y="36"  width="1036" height="80" fill="rgba(45,49,66,0.018)"/>
      <rect x="140" y="196" width="1036" height="80" fill="rgba(45,49,66,0.018)"/>
      <rect x="140" y="356" width="1036" height="80" fill="rgba(45,49,66,0.018)"/>

      <!-- Lane dividers -->
      <line x1="0" y1="36"  x2="1176" y2="36"  stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="1176" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="1176" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="1176" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="356" x2="1176" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="436" x2="1176" y2="436" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <!-- Label column divider -->
      <line x1="140" y1="36" x2="140" y2="436" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

      <!-- ===================== ARROWS (drawn before nodes) ===================== -->
      <!-- 1. PUR j0 -> PUR j1 (same lane) -->
      <line x1="248" y1="156" x2="260" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- 2. PUR j1 -> SUP j2 (upward) -->
      <path d="M360,156 H414 Q422,156 422,148 V108" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- 3. SUP j2 -> PUR j3 (downward) -->
      <path d="M472,76 H526 Q534,76 534,84 V124" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- 4. PUR j3 -> INV j4 (focal-in, downward) -->
      <path d="M584,156 H638 Q646,156 646,164 V204" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- 5. INV j4 -> SAL j5 (downward) -->
      <path d="M696,236 H750 Q758,236 758,244 V284" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- 6. CUS j5 -> SAL j5 (upward) -->
      <path d="M808,396 H750 Q758,396 758,388 V348" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- 7. SAL j5 -> INV j6 (downward) -->
      <path d="M808,316 H862 Q870,316 870,324 V204" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- 8. INV j6 -> SAL j7 (downward) -->
      <path d="M920,236 H974 Q982,236 982,244 V284" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ===================== NODES ===================== -->
      <!-- PUR j0 主数据维护 -->
      <g>
        <rect x="148" y="124" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="148" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="152" y="128" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
        <text x="159" y="136" fill="#2d3142" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">PUR</text>
        <text x="198" y="150" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">主数据维护</text>
        <text x="198" y="166" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">产品·规格·供应商</text>
      </g>
      <!-- SAL j0 客户与价格 -->
      <g>
        <rect x="148" y="284" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="148" y="284" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="152" y="288" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
        <text x="159" y="296" fill="#2d3142" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">SAL</text>
        <text x="198" y="310" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">客户与价格</text>
        <text x="198" y="326" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">客户·账期·收款码</text>
      </g>
      <!-- PUR j1 采购订单 -->
      <g>
        <rect x="260" y="124" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="260" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="264" y="128" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
        <text x="271" y="136" fill="#2d3142" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">PUR</text>
        <text x="310" y="150" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">采购订单</text>
        <text x="310" y="166" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">下推至供应商</text>
      </g>
      <!-- SUP j2 供应商供货 -->
      <g>
        <rect x="372" y="44" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="372" y="44" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="376" y="48" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
        <text x="383" y="56" fill="#2d3142" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">SUP</text>
        <text x="422" y="70" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">供应商供货</text>
        <text x="422" y="86" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">发货至仓库</text>
      </g>
      <!-- PUR j3 采购收货 -->
      <g>
        <rect x="484" y="124" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="484" y="124" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="488" y="128" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
        <text x="495" y="136" fill="#2d3142" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">PUR</text>
        <text x="534" y="150" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">采购收货</text>
        <text x="534" y="166" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">核对到货</text>
      </g>
      <!-- INV j4 入库 (FOCAL) -->
      <g>
        <rect x="596" y="204" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="596" y="204" width="100" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="600" y="208" width="14" height="10" rx="2" fill="rgba(235,108,54,0.18)"/>
        <text x="607" y="216" fill="#eb6c36" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">INV</text>
        <text x="646" y="230" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">入库上架</text>
        <text x="646" y="246" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">库存 +</text>
      </g>
      <!-- SAL j5 销售订单 -->
      <g>
        <rect x="708" y="284" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="708" y="284" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="712" y="288" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
        <text x="719" y="296" fill="#2d3142" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">SAL</text>
        <text x="758" y="310" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">销售订单</text>
        <text x="758" y="326" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">客户下单·快照价</text>
      </g>
      <!-- CUS j5 客户下单 -->
      <g>
        <rect x="708" y="364" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="708" y="364" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="712" y="368" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
        <text x="719" y="376" fill="#2d3142" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">CUS</text>
        <text x="758" y="390" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">客户下单</text>
        <text x="758" y="406" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">渠道 / 后台</text>
      </g>
      <!-- INV j6 拣货出库 -->
      <g>
        <rect x="820" y="204" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="820" y="204" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="824" y="208" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
        <text x="831" y="216" fill="#2d3142" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">INV</text>
        <text x="870" y="230" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">拣货出库</text>
        <text x="870" y="246" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">库存 −</text>
      </g>
      <!-- SAL j7 发货配送 -->
      <g>
        <rect x="932" y="284" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="932" y="284" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="936" y="288" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
        <text x="943" y="296" fill="#2d3142" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">SAL</text>
        <text x="982" y="310" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">发货配送</text>
        <text x="982" y="326" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">生成订单日志</text>
      </g>
      <!-- INV j8 盘点 / 报损报溢 -->
      <g>
        <rect x="1044" y="204" width="100" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="1044" y="204" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1048" y="208" width="14" height="10" rx="2" fill="rgba(45,49,66,0.12)"/>
        <text x="1055" y="216" fill="#2d3142" font-size="6" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">INV</text>
        <text x="1094" y="230" fill="#2d3142" font-size="10" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">盘点/报损报溢</text>
        <text x="1094" y="246" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">审核 → 库存变动</text>
      </g>

      <!-- ===================== STEP HEADER CHIPS ===================== -->
      <!-- j0 -->
      <rect x="190" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="198" y="19" fill="#2d3142" font-size="8" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">1</text>
      <text x="198" y="32" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">主数据</text>
      <!-- j1 -->
      <rect x="302" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="310" y="19" fill="#2d3142" font-size="8" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">2</text>
      <text x="310" y="32" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">采购订单</text>
      <!-- j2 -->
      <rect x="414" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="422" y="19" fill="#2d3142" font-size="8" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">3</text>
      <text x="422" y="32" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">供应商供货</text>
      <!-- j3 -->
      <rect x="526" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="534" y="19" fill="#2d3142" font-size="8" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">4</text>
      <text x="534" y="32" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">采购收货</text>
      <!-- j4 FOCAL -->
      <rect x="638" y="8" width="16" height="16" rx="8" fill="rgba(235,108,54,0.20)"/>
      <text x="646" y="19" fill="#eb6c36" font-size="8" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">5</text>
      <text x="646" y="32" fill="#eb6c36" font-size="8" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">入库·枢纽</text>
      <!-- j5 -->
      <rect x="750" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="758" y="19" fill="#2d3142" font-size="8" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">6</text>
      <text x="758" y="32" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">销售订单</text>
      <!-- j6 -->
      <rect x="862" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="870" y="19" fill="#2d3142" font-size="8" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">7</text>
      <text x="870" y="32" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">拣货出库</text>
      <!-- j7 -->
      <rect x="974" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="982" y="19" fill="#2d3142" font-size="8" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">8</text>
      <text x="982" y="32" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">发货配送</text>
      <!-- j8 -->
      <rect x="1086" y="8" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
      <text x="1094" y="19" fill="#2d3142" font-size="8" font-weight="600" font-family="var(--font-mono)" text-anchor="middle">9</text>
      <text x="1094" y="32" fill="#4f5d75" font-size="8" font-family="var(--font-sans)" text-anchor="middle">库存调整</text>

      <!-- ===================== LANE LABELS ===================== -->
      <text x="70" y="80"  fill="#2d3142" font-size="11" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">供应商</text>
      <text x="70" y="160" fill="#2d3142" font-size="11" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">采购</text>
      <text x="70" y="240" fill="#eb6c36" font-size="11" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">库存</text>
      <text x="70" y="320" fill="#2d3142" font-size="11" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">销售</text>
      <text x="70" y="400" fill="#2d3142" font-size="11" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">客户</text>

      <!-- ===================== LEGEND ===================== -->
      <line x1="30" y1="428" x2="1146" y2="428" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="448" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" letter-spacing="0.14em">图例</text>
      <line x1="120" y1="452" x2="160" y2="452" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="170" y="455" fill="#4f5d75" font-size="9" font-family="var(--font-sans)">业务流程主线（库存 ± 流转）</text>
      <line x1="430" y1="452" x2="470" y2="452" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="480" y="455" fill="#eb6c36" font-size="9" font-family="var(--font-sans)">关键枢纽：入库上架（库存中枢）</text>
      <text x="30" y="478" fill="#7a8399" font-size="8" font-family="var(--font-sans)">盘点 / 报损报溢需经审核（通过才真正增减库存，驳回关闭单据），所有变动留痕于库存流水。</text>
    </svg>
  </div>
</body>
</html>
