# XSY-SCM 本地 Docker Desktop 编排（前端 + 后端）
#
# 依赖策略：MySQL 复用本机 3306（Windows 服务），Redis 复用已运行的 xsy-redis 容器，
# 容器内统一通过 host.docker.internal 访问宿主机端口。
# 若需要连容器内的 MySQL/Redis，见 docker-compose.db.yml。
#
# 用法：
#   docker-compose -f deploy/docker/docker-compose.yml up -d --build
#   或：deploy/docker/scripts/deploy.sh up

name: xsy-scm

services:
  # ------------------------------------------------------------ 后端
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
      args:
        MAVEN_PROFILE: ${MAVEN_PROFILE:-dev}
    image: xsy-scm-server:${TAG:-dev}
    container_name: xsy-scm-server
    restart: unless-stopped
    ports:
      - '${SERVER_PORT:-1024}:1024'
    environment:
      TZ: Asia/Shanghai
      # dev/application.yaml 中 localPath -> 容器内日志目录
      LOCALPATH: /app/logs
      # 数据库：宿主机 MySQL
      SPRING_DATASOURCE_URL: jdbc:p6spy:mysql://host.docker.internal:${MYSQL_PORT:-3306}/${MYSQL_DB:-supply_chain}?autoReconnect=true&useServerPreparedStmts=false&rewriteBatchedStatements=true&characterEncoding=UTF-8&useSSL=false&allowMultiQueries=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-}
      # Redis：宿主机 6379（xsy-redis 容器已映射）
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DB:-1}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 本地文件上传目录（覆盖 dev/sa-base.yaml 里的 Windows 路径）
      FILE_STORAGE_LOCAL_UPLOAD_PATH: /app/upload
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - xsy-upload:/app/upload
      - xsy-logs:/app/logs
    networks:
      - xsy-net
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'echo > /dev/tcp/127.0.0.1/1024' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  # ------------------------------------------------------------ 前端（Nginx）
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web/Dockerfile
      args:
        VITE_APP_API_URL: ${VITE_APP_API_URL:-/api}
    image: xsy-scm-web:${TAG:-dev}
    container_name: xsy-scm-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # 挂载仓库内的 nginx 配置，改配置无需重建镜像
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - xsy-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/admin/ || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  xsy-upload:
  xsy-logs:

networks:
  xsy-net:
    driver: bridge
