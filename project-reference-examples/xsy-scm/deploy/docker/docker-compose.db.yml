# 可选：容器内跑 MySQL / Redis（全新环境、不想依赖宿主机服务时使用）
#
# 用法（叠加在主编排之上）：
#   docker-compose -f docker-compose.yml -f docker-compose.db.yml up -d
# 然后把 .env 里的 MYSQL_* / REDIS_* 指向容器名：
#   MYSQL_HOST=mysql   REDIS_HOST=redis
#
# 首次启动会把 deploy/sql 下的脚本导入到 supply_chain 库。

services:
  mysql:
    image: mysql:8.0
    container_name: xsy-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_PASSWORD:-1024}'
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    networks:
      - xsy-net
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xsy-redis-docker
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      - xsy-net
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
