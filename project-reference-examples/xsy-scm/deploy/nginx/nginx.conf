# XSY-SCM 前端 Nginx 配置（容器部署形态）
#   /        -> 302 跳转到 /admin/
#   /admin/  -> PC 管理后台静态资源（xsy-scm-web）
#   /h5/     -> 移动端 H5 静态资源（xsy-app）
#   /api/    -> 反向代理到 Spring Boot 后端（剥离 /api 前缀）
#
# 由 deploy/docker/docker-compose.yml 挂载到 /etc/nginx/conf.d/default.conf

upstream xsy_scm_server {
    # compose 网络内的后端服务名
    server backend:1024;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 根路径跳转到管理后台
    location = / {
        return 302 /admin/;
    }

    # PC 管理后台
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 移动端 H5
    location /h5/ {
        alias /usr/share/nginx/html/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # 后端接口（/api/login -> 后端 /login）
    location /api/ {
        proxy_pass http://xsy_scm_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 带 hash 的构建产物可长期缓存
    location ~* ^/(admin|h5)/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
