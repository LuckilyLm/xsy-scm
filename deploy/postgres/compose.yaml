# xsy-scm V2 本地开发 / 集成测试 PostgreSQL（Docker Desktop）
#
# 为什么用容器而不是本机原生 PostgreSQL：
#   1. 本机 `D:\PostgreSQL` 实例（18.3，端口 15432）作为 Windows 服务运行，
#      启停需要管理员权限（`net start` → 系统错误 5），且上一次是异常中断，
#      每次启动都要做一次分钟级的 crash recovery（fsync 全库）；
#   2. 容器实例与宿主环境解耦：版本固定、数据卷可整体删除重建、不污染系统服务；
#   3. 与 `deploy/minio/` 一致 —— 本地依赖一律用 compose 声明，README 写清操作。
#
# 端口/库/schema/用户与 sa-base 的 `test` / `dev` profile 默认值逐字一致，
# 因此**不需要**设置任何 XSY_V2_* 环境变量即可直接跑 IT 与本地启动。
#
# 注意：host 端口固定 15432，启动前必须确认本机原生 PostgreSQL 服务已停止，
# 否则端口冲突（`(echo > /dev/tcp/127.0.0.1/15432)` 可快速探测）。
name: xsy-v2-postgres

services:
  postgres:
    image: postgres:18-alpine
    container_name: xsy-v2-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xsy_scm}
      POSTGRES_USER: ${POSTGRES_USER:-xsy_scm_app}
      # sa-base 的 test/dev profile 里 `password: ${XSY_V2_DB_PASSWORD:}` 默认是**空密码**，
      # 因此这里用 trust 认证保持零配置可用（仅监听 127.0.0.1，见 ports）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
      # 日志与 CURRENT_TIMESTAMP 的可读性；业务语义仍以 TIMESTAMPTZ + 显式
      # `AT TIME ZONE 'Asia/Shanghai'` 为准（见 V15 的 ck_purchase_demand_date）。
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      # 只绑回环地址：本地开发库不对外暴露。
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 官方镜像改变了数据目录约定：18+ 必须挂载到 /var/lib/postgresql
      # （镜像内部再建 major-version 子目录，便于将来 pg_upgrade --link）。
      # 仍挂 /var/lib/postgresql/data 会在启动时报
      # 「there appears to be PostgreSQL data in ... (unused mount/volume)」并反复重启。
      # 见 https://github.com/docker-library/postgres/pull/1259
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xsy_scm_app} -d ${POSTGRES_DB:-xsy_scm}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  # 具名卷：`docker compose down -v` 才能清库；普通 down/up 保留数据。
  postgres-data:
