#############################################################################################################
#                                                                                                           #
# 为了减少重复配置，本配置文件为此xsy-admin的独有配置，更多配置请查看 xsy-base 项目中的 xsy-base.yaml 通用配置文件。      #
# 其中此文件中配置可以覆盖 xsy-base.yaml 中的通用配置，具体实现类请看类：YamlProcessor.java                          #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: xsy-admin
  log-directory: /home/logs/xsy-scm-admin/${spring.profiles.active}

# 项目端口和url根路径
server:
  port: 1024
  servlet:
    context-path: /

# 环境
spring:
  profiles:
    active: '@profiles.active@'

# 盘点表导入凭证的签名密钥：缺失或沿用仓库内开发默认值时应用启动失败（见 StocktakeSnapshotSigner）
scm:
  inventory:
    stocktake:
      snapshot:
        secret: ${SCM_INVENTORY_STOCKTAKE_SNAPSHOT_SECRET:}