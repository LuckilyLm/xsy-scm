#############################################################################################################
#                                                                                                           #
# 为了减少重复配置，本配置文件为此sa-admin的独有配置，更多配置请查看 sa-base 项目中的 sa-base.yaml 通用配置文件。      #
# 其中此文件中配置可以覆盖 sa-base.yaml 中的通用配置，具体实现类请看类：YamlProcessor.java                          #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
# 注意：这里不能写 ${project.name}。本文件参与 Maven 资源过滤（filtering=true），
# 而 ${project.name} 是 Maven 内置属性，会被替换成模块 artifactId（sa-admin），
# 覆盖掉 YAML 中的 project.name 键。因此日志目录段使用字面量。
project:
  name: xsy-scm-v2-admin
  # 默认值不写死盘符：原基线硬编码 D:/Browser Download/...，遇到没有 D 盘的机器直接不可用。
  # XSY_V2_LOG_DIR 存在时优先（部署 / CI 用绝对路径），否则落到仓库内 .runtime/logs。
  log-directory: ${XSY_V2_LOG_DIR:../.runtime/logs}/xsy-scm-v2-admin/${spring.profiles.active}

# 项目端口和url根路径
# 注意：SmartAdmin 原基线默认 1024，但本机 Windows 的动态端口范围是 1024-15000
# （netsh int ipv4 show dynamicport tcp → 启动端口 1024，端口数 13977），
# 1024 会与系统服务的临时连接冲突（bind 报 EACCES / Port already in use）。
# 因此 dev 默认改为动态范围之外的 18080，并保留环境变量覆盖能力。
server:
  port: ${XSY_V2_SERVER_PORT:18080}
  servlet:
    context-path: /

# 环境
spring:
  profiles:
    active: '@profiles.active@'
