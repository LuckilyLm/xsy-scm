#############################################################################################################
#                                                                                                           #
# 为了减少重复配置，本配置文件为此sa-admin的独有配置，更多配置请查看 sa-base 项目中的 sa-base.yaml 通用配置文件。      #
# 其中此文件中配置可以覆盖 sa-base.yaml 中的通用配置，具体实现类请看类：YamlProcessor.java                          #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: sa-admin
  log-directory: ${PROJECT_LOG_DIRECTORY:/home/logs/xsy-scm-v2-admin/prod}

# 项目端口和url根路径
server:
  port: ${SERVER_PORT:1024}
  servlet:
    context-path: /

# 环境
spring:
  profiles:
    active: '@profiles.active@'

# 盘点快照导入凭证的签名密钥：缺失或沿用仓库内开发默认值时应用启动失败（见 StocktakeSnapshotSigner）
scm:
  inventory:
    stocktake:
      snapshot:
        secret: ${SCM_INVENTORY_STOCKTAKE_SNAPSHOT_SECRET:}
  trace:
    # 包装码标签二维码里的公开页地址（后台是哈希路由，配到站点根即可，例如 https://scm.example.com）。
    # 留空时标签只印码不印二维码，扫码入口等于不可用，因此对外部署必须显式配置。
    public-base-url: ${SCM_TRACE_PUBLIC_BASE_URL:}
