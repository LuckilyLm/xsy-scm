spring:
  application:
    name: xsy-scm-server
  datasource:
    url: ${XSY_DB_URL:jdbc:postgresql://localhost:5432/xsy_scm}
    username: ${XSY_DB_USERNAME:postgres}
    password: ${XSY_DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${XSY_SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
