name: xsy-scm

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_PROFILE: \${MAVEN_PROFILE:-prod}
    image: xsy-scm-backend:\${TAG:-local}
    container_name: xsy-scm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    ports:
      - "\${SERVER_BIND_ADDRESS:-127.0.0.1}:\${SERVER_PORT:-1024}:1024"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 1024
      PROJECT_LOG_DIRECTORY: /app/logs
      XSY_V2_DB_URL: jdbc:postgresql://postgres:5432/\${POSTGRES_DB:-xsy_scm}?currentSchema=xsy_v2&ApplicationName=xsy-scm-v2
      XSY_V2_DB_USERNAME: \${POSTGRES_USER:-xsy_scm_app}
      XSY_V2_DB_PASSWORD: \${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell environment}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: \${REDIS_DATABASE:-1}
      SPRING_DATA_REDIS_PASSWORD: \${REDIS_PASSWORD:-}
      XSY_FILE_STORAGE_MODE: cloud
      XSY_FILE_REGION: us-east-1
      XSY_FILE_ENDPOINT: http://minio:9000
      XSY_FILE_BUCKET: \${MINIO_BUCKET:-xsy-scm-dev}
      XSY_FILE_ACCESS_KEY: \${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env or the shell environment}
      XSY_FILE_SECRET_KEY: \${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env or the shell environment}
      XSY_FILE_PATH_STYLE: "true"
      XSY_FILE_SEND_OBJECT_ACL: "false"
      XSY_FILE_PUBLIC_URL_PREFIX: http://127.0.0.1:\${MINIO_PORT:-9000}/\${MINIO_BUCKET:-xsy-scm-dev}/
      JAVA_OPTS: \${JAVA_OPTS:--Xms512m -Xmx1024m}
    volumes:
      - xsy-scm-logs:/app/logs
      - xsy-scm-upload:/app/upload
    security_opt:
      - no-new-privileges:true

  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: xsy-scm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: \${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env or the shell environment}
      MINIO_ROOT_PASSWORD: \${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env or the shell environment}
    ports:
      - "\${MINIO_BIND_ADDRESS:-127.0.0.1}:\${MINIO_PORT:-9000}:9000"
      - "\${MINIO_BIND_ADDRESS:-127.0.0.1}:\${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - xsy-scm-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: xsy-scm-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: \${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env or the shell environment}
      MINIO_ROOT_PASSWORD: \${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env or the shell environment}
      MINIO_BUCKET: \${MINIO_BUCKET:-xsy-scm-dev}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
      mc mb --ignore-existing "local/$$MINIO_BUCKET"
    restart: "no"

  postgres:
    image: postgres:18-alpine
    container_name: xsy-scm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: \${POSTGRES_DB:-xsy_scm}
      POSTGRES_USER: \${POSTGRES_USER:-xsy_scm_app}
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell environment}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "\${POSTGRES_BIND_ADDRESS:-127.0.0.1}:\${POSTGRES_PORT:-15432}:5432"
    volumes:
      - xsy-scm-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \${POSTGRES_USER:-xsy_scm_app} -d \${POSTGRES_DB:-xsy_scm}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    container_name: xsy-scm-redis
    restart: unless-stopped
    command: >-
      redis-server --appendonly yes --databases 16
      \${REDIS_PASSWORD:+--requirepass \${REDIS_PASSWORD}}
    command: >-
      redis-server
      --appendonly yes
      --databases 16
      \${REDIS_PASSWORD:+--requirepass \${REDIS_PASSWORD}}
    ports:
      - "\${REDIS_BIND_ADDRESS:-127.0.0.1}:\${REDIS_PORT:-6379}:6379"
    volumes:
      - xsy-scm-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli \${REDIS_PASSWORD:+-a \"\${REDIS_PASSWORD}\"} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  xsy-scm-logs:
  xsy-scm-upload:
  xsy-scm-postgres:
  xsy-scm-redis:
  xsy-scm-minio:
