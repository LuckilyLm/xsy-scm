name: xsy-scm

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: xsy-scm-web:${TAG:-v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-7515}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_PROFILE: ${MAVEN_PROFILE:-prod}
    image: xsy-scm-backend:${TAG:-v1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-1024}:1024"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 1024
      PROJECT_LOG_DIRECTORY: /app/logs
      XSY_V2_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-xsy_scm}?currentSchema=xsy_v2&ApplicationName=xsy-scm-v2
      XSY_V2_DB_USERNAME: ${POSTGRES_USER:-xsy_scm_app}
      XSY_V2_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DATABASE:-1}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      XSY_FILE_STORAGE_MODE: cloud
      XSY_FILE_REGION: us-east-1
      # S3 client 和 Presigner 共用地址，必须同时对浏览器和容器可达。
      XSY_FILE_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Set MINIO_PUBLIC_ENDPOINT in .env}
      XSY_FILE_BUCKET: ${MINIO_BUCKET:-xsy-scm-test}
      XSY_FILE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      XSY_FILE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      XSY_FILE_PATH_STYLE: "true"
      XSY_FILE_SEND_OBJECT_ACL: "false"
      XSY_FILE_PUBLIC_URL_PREFIX: ${MINIO_PUBLIC_ENDPOINT:?Set MINIO_PUBLIC_ENDPOINT in .env}/${MINIO_BUCKET:-xsy-scm-test}/
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    volumes:
      - xsy-scm-logs:/app/logs
    # 原生未引入 Actuator；检查现有匿名只读接口及成功响应，避免 HTTP 200 错误包误报健康。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1024/login/getTwoFactorLoginFlag | grep -Eq '\"code\"[[:space:]]*:[[:space:]]*0[[:space:]]*,'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xsy_scm}
      POSTGRES_USER: ${POSTGRES_USER:-xsy_scm_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - xsy-scm-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --databases 16 --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - xsy-scm-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  minio:
    # 固定可直接拉取的官方镜像；该历史版本的使用限制见 README。
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_BIND_ADDRESS:-0.0.0.0}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - xsy-scm-minio:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      XSY_FILE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      XSY_FILE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      XSY_FILE_BUCKET: ${MINIO_BUCKET:-xsy-scm-test}
    volumes:
      - ./deploy/minio/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"

volumes:
  xsy-scm-logs:
  xsy-scm-postgres:
  xsy-scm-redis:
  xsy-scm-minio:
